<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArtPaletteAttachment - AI图像上色助手</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .chat-container {
            width: 90%;
            max-width: 800px;
            height: 90vh;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
            position: relative;
        }

        .chat-header h1 {
            font-size: 24px;
            font-weight: 600;
        }

        .chat-header p {
            font-size: 14px;
            opacity: 0.9;
            margin-top: 5px;
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background: #f8f9fa;
        }

        .message {
            margin-bottom: 20px;
            display: flex;
            align-items: flex-start;
        }

        .message.user {
            justify-content: flex-end;
        }

        .message.ai {
            justify-content: flex-start;
        }

        .message-content {
            max-width: 70%;
            padding: 15px 20px;
            border-radius: 20px;
            position: relative;
        }

        .message.user .message-content {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-bottom-right-radius: 5px;
        }

        .message.ai .message-content {
            background: white;
            color: #333;
            border: 1px solid #e1e5e9;
            border-bottom-left-radius: 5px;
        }

        .message-image {
            max-width: 100%;
            border-radius: 10px;
            margin-top: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .chat-input {
            padding: 20px;
            background: white;
            border-top: 1px solid #e1e5e9;
        }

        .input-container {
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }

        .input-wrapper {
            flex: 1;
            position: relative;
        }

        .chat-textarea {
            width: 100%;
            min-height: 50px;
            max-height: 120px;
            padding: 15px 50px 15px 15px;
            border: 2px solid #e1e5e9;
            border-radius: 25px;
            font-size: 16px;
            resize: none;
            outline: none;
            transition: border-color 0.3s;
        }

        .chat-textarea:focus {
            border-color: #667eea;
        }

        .file-input {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            opacity: 0;
            width: 30px;
            height: 30px;
            cursor: pointer;
        }

        .file-label {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #667eea;
            font-size: 20px;
        }

        .send-button {
            width: 50px;
            height: 50px;
            border: none;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: transform 0.2s;
        }

        .send-button:hover {
            transform: scale(1.05);
        }

        .send-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .typing-indicator {
            display: none;
            padding: 15px 20px;
            background: white;
            border: 1px solid #e1e5e9;
            border-radius: 20px;
            border-bottom-left-radius: 5px;
            max-width: 70%;
        }

        .typing-dots {
            display: flex;
            gap: 4px;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #667eea;
            animation: typing 1.4s infinite;
        }

        .typing-dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {
            0%, 60%, 100% {
                transform: translateY(0);
            }
            30% {
                transform: translateY(-10px);
            }
        }

        .welcome-message {
            text-align: center;
            color: #666;
            padding: 40px 20px;
        }

        .welcome-message h2 {
            color: #333;
            margin-bottom: 10px;
        }

        @media (max-width: 768px) {
            .chat-container {
                width: 95%;
                height: 95vh;
                border-radius: 15px;
            }

            .message-content {
                max-width: 85%;
            }

            .chat-header h1 {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <h1>🎨 ArtPaletteAttachment</h1>
            <p>AI图像上色助手 - 让黑白照片重获色彩</p>
        </div>

        <div class="chat-messages" id="chatMessages">
            <div class="welcome-message">
                <h2>欢迎使用 ArtPaletteAttachment！</h2>
                <p>上传您的黑白图片，告诉我您想要的上色风格，我将为您创造出精美的彩色作品。</p>
                <p>支持格式：PNG 图片</p>
            </div>
        </div>

        <div class="typing-indicator" id="typingIndicator">
            <div class="typing-dots">
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
            </div>
        </div>

        <div class="chat-input">
            <div class="input-container">
                <div class="input-wrapper">
                    <textarea 
                        id="messageInput" 
                        class="chat-textarea" 
                        placeholder="描述您想要的上色风格，或直接上传图片..."
                        rows="1"
                    ></textarea>
                    <input 
                        type="file" 
                        id="fileInput" 
                        class="file-input" 
                        accept="image/png"
                    >
                    <label for="fileInput" class="file-label">📎</label>
                </div>
                <button id="sendButton" class="send-button">
                    ➤
                </button>
            </div>
        </div>
    </div>

    <script>
        class ArtPaletteChat {
            constructor() {
                this.chatMessages = document.getElementById('chatMessages');
                this.messageInput = document.getElementById('messageInput');
                this.fileInput = document.getElementById('fileInput');
                this.sendButton = document.getElementById('sendButton');
                this.typingIndicator = document.getElementById('typingIndicator');
                
                this.currentImage = null;
                this.isProcessing = false;
                
                this.initializeEventListeners();
                this.autoResizeTextarea();
            }

            initializeEventListeners() {
                this.sendButton.addEventListener('click', () => this.handleSend());
                this.messageInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter' && !e.shiftKey) {
                        e.preventDefault();
                        this.handleSend();
                    }
                });
                
                this.fileInput.addEventListener('change', (e) => this.handleFileSelect(e));
                this.messageInput.addEventListener('input', () => this.autoResizeTextarea());
            }

            autoResizeTextarea() {
                this.messageInput.style.height = 'auto';
                this.messageInput.style.height = Math.min(this.messageInput.scrollHeight, 120) + 'px';
            }

            handleFileSelect(event) {
                const file = event.target.files[0];
                if (file) {
                    this.currentImage = file;
                    this.addMessage('user', `已选择图片: ${file.name}`, file);
                    
                    if (!this.messageInput.value.trim()) {
                        this.messageInput.placeholder = "请描述您想要的上色风格...";
                    }
                }
            }

            async handleSend() {
                const message = this.messageInput.value.trim();
                
                if (!message && !this.currentImage) {
                    return;
                }

                if (this.isProcessing) {
                    return;
                }

                // 添加用户消息
                if (message) {
                    this.addMessage('user', message);
                }

                // 清空输入
                this.messageInput.value = '';
                this.autoResizeTextarea();

                // 如果有图片和提示词，开始处理
                if (this.currentImage && message) {
                    await this.processColorization(this.currentImage, message);
                } else if (this.currentImage && !message) {
                    this.addMessage('ai', '请告诉我您想要什么样的上色风格，比如"温暖的秋日色调"或"鲜艳的夏日色彩"。');
                } else if (!this.currentImage && message) {
                    this.addMessage('ai', '请先上传一张PNG格式的黑白图片，然后我就可以根据您的描述为它上色了！');
                }
            }

            async processColorization(imageFile, prompt) {
                this.isProcessing = true;
                this.sendButton.disabled = true;
                this.showTyping();

                try {
                    const formData = new FormData();
                    formData.append('image', imageFile);
                    formData.append('prompt', prompt);

                    const response = await fetch('http://localhost:5000/colorize', {
                        method: 'POST',
                        body: formData
                    });

                    this.hideTyping();

                    if (!response.ok) {
                        const err = await response.json();
                        throw new Error(err.error || '服务器错误');
                    }

                    const contentType = response.headers.get('Content-Type');
                    if (!contentType || !contentType.startsWith('image/')) {
                        throw new Error('服务器返回的不是图像格式');
                    }

                    const blob = await response.blob();
                    const imageUrl = URL.createObjectURL(blob);
                    
                    this.addMessage('ai', '太棒了！我已经根据您的描述为图片上色完成。这是上色后的结果：', null, imageUrl);
                    
                    // 重置状态
                    this.currentImage = null;
                    this.fileInput.value = '';
                    this.messageInput.placeholder = "描述您想要的上色风格，或直接上传图片...";

                } catch (error) {
                    this.hideTyping();
                    console.error('上色处理失败:', error);
                    this.addMessage('ai', `抱歉，处理过程中出现了错误：${error.message}。请检查网络连接或稍后重试。`);
                } finally {
                    this.isProcessing = false;
                    this.sendButton.disabled = false;
                }
            }

            addMessage(sender, text, file = null, resultImage = null) {
                const messageDiv = document.createElement('div');
                messageDiv.className = `message ${sender}`;

                const contentDiv = document.createElement('div');
                contentDiv.className = 'message-content';

                if (text) {
                    const textP = document.createElement('p');
                    textP.textContent = text;
                    contentDiv.appendChild(textP);
                }

                // 显示上传的文件
                if (file && file.type.startsWith('image/')) {
                    const img = document.createElement('img');
                    img.className = 'message-image';
                    img.src = URL.createObjectURL(file);
                    img.alt = '上传的图片';
                    contentDiv.appendChild(img);
                }

                // 显示处理结果图片
                if (resultImage) {
                    const img = document.createElement('img');
                    img.className = 'message-image';
                    img.src = resultImage;
                    img.alt = '上色结果';
                    contentDiv.appendChild(img);
                }

                messageDiv.appendChild(contentDiv);
                
                // 移除欢迎消息
                const welcomeMessage = this.chatMessages.querySelector('.welcome-message');
                if (welcomeMessage) {
                    welcomeMessage.remove();
                }

                this.chatMessages.appendChild(messageDiv);
                this.scrollToBottom();
            }

            showTyping() {
                this.typingIndicator.style.display = 'block';
                this.scrollToBottom();
            }

            hideTyping() {
                this.typingIndicator.style.display = 'none';
            }

            scrollToBottom() {
                setTimeout(() => {
                    this.chatMessages.scrollTop = this.chatMessages.scrollHeight;
                }, 100);
            }
        }

        // 初始化聊天应用
        document.addEventListener('DOMContentLoaded', () => {
            new ArtPaletteChat();
        });
    </script>
</body>
</html>
