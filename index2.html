<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArtPaletteAttachment - AI图像上色助手</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: white;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* 顶部导航栏 */
        .top-navbar {
            height: 60px;
            background: white;
            border-bottom: 1px solid #e1e5e9;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            position: relative;
            z-index: 1000;
        }

        .navbar-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .ai-name {
            font-size: 20px;
            font-weight: 600;
            color: #333;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .navbar-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .navbar-button {
            padding: 8px 16px;
            border: 1px solid #e1e5e9;
            border-radius: 8px;
            background: white;
            color: #333;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }

        .navbar-button:hover {
            background: #f8f9fa;
            border-color: #667eea;
        }

        /* 主要内容区域 */
        .main-content {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        /* 左侧边栏 */
        .sidebar {
            width: 280px;
            background: #f8f9fa;
            border-right: 1px solid #e1e5e9;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid #e1e5e9;
        }

        .new-chat-button {
            width: 100%;
            padding: 12px 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: transform 0.2s;
        }

        .new-chat-button:hover {
            transform: translateY(-1px);
        }

        .conversations-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .conversation-item {
            padding: 12px 16px;
            margin-bottom: 4px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
            border: 1px solid transparent;
        }

        .conversation-item:hover {
            background: white;
            border-color: #e1e5e9;
        }

        .conversation-item.active {
            background: white;
            border-color: #667eea;
            box-shadow: 0 2px 4px rgba(102, 126, 234, 0.1);
        }

        .conversation-title {
            font-size: 14px;
            color: #333;
            font-weight: 500;
            margin-bottom: 4px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .conversation-preview {
            font-size: 12px;
            color: #666;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .conversation-time {
            font-size: 11px;
            color: #999;
            margin-top: 4px;
        }

        /* 聊天区域 */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: white;
        }

        .chat-header {
            padding: 20px;
            border-bottom: 1px solid #e1e5e9;
            background: white;
        }

        .chat-title {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }

        .chat-subtitle {
            font-size: 14px;
            color: #666;
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background: #fafafa;
        }

        .message {
            margin-bottom: 20px;
            display: flex;
            align-items: flex-start;
        }

        .message.user {
            justify-content: flex-end;
        }

        .message.ai {
            justify-content: flex-start;
        }

        .message-content {
            max-width: 70%;
            padding: 15px 20px;
            border-radius: 16px;
            position: relative;
        }

        .message.user .message-content {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.ai .message-content {
            background: white;
            color: #333;
            border: 1px solid #e1e5e9;
            border-bottom-left-radius: 4px;
        }

        .message-image {
            max-width: 100%;
            border-radius: 8px;
            margin-top: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .chat-input {
            padding: 20px;
            background: white;
            border-top: 1px solid #e1e5e9;
        }

        .input-container {
            display: flex;
            gap: 10px;
            align-items: flex-end;
            max-width: 800px;
            margin: 0 auto;
        }

        .input-wrapper {
            flex: 1;
            position: relative;
        }

        .chat-textarea {
            width: 100%;
            min-height: 50px;
            max-height: 120px;
            padding: 15px 50px 15px 15px;
            border: 2px solid #e1e5e9;
            border-radius: 25px;
            font-size: 16px;
            resize: none;
            outline: none;
            transition: border-color 0.3s;
            background: white;
        }

        .chat-textarea:focus {
            border-color: #667eea;
        }

        .file-input {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            opacity: 0;
            width: 30px;
            height: 30px;
            cursor: pointer;
        }

        .file-label {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #667eea;
            font-size: 18px;
        }

        .send-button {
            width: 50px;
            height: 50px;
            border: none;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: transform 0.2s;
        }

        .send-button:hover {
            transform: scale(1.05);
        }

        .send-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .typing-indicator {
            display: none;
            padding: 15px 20px;
            background: white;
            border: 1px solid #e1e5e9;
            border-radius: 16px;
            border-bottom-left-radius: 4px;
            max-width: 70%;
        }

        .typing-dots {
            display: flex;
            gap: 4px;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #667eea;
            animation: typing 1.4s infinite;
        }

        .typing-dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {
            0%, 60%, 100% {
                transform: translateY(0);
            }
            30% {
                transform: translateY(-10px);
            }
        }

        .welcome-message {
            text-align: center;
            color: #666;
            padding: 40px 20px;
        }

        .welcome-message h2 {
            color: #333;
            margin-bottom: 10px;
            font-size: 24px;
        }

        .welcome-message p {
            margin-bottom: 8px;
            line-height: 1.5;
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #666;
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .sidebar {
                width: 260px;
            }
            
            .message-content {
                max-width: 85%;
            }
            
            .ai-name {
                font-size: 18px;
            }
        }

        @media (max-width: 640px) {
            .sidebar {
                position: fixed;
                left: -280px;
                top: 60px;
                height: calc(100vh - 60px);
                z-index: 999;
                transition: left 0.3s;
            }
            
            .sidebar.open {
                left: 0;
            }
            
            .mobile-menu-button {
                display: block;
                background: none;
                border: none;
                font-size: 20px;
                cursor: pointer;
                color: #333;
            }
        }

        .mobile-menu-button {
            display: none;
        }
    </style>
</head>
<body>
    <!-- 顶部导航栏 -->
    <div class="top-navbar">
        <div class="navbar-left">
            <button class="mobile-menu-button" id="mobileMenuButton">☰</button>
            <div class="ai-name">
                🎨 ArtPaletteAttachment
            </div>
        </div>
        <div class="navbar-right">
            <button class="navbar-button">👤 Profile</button>
            <button class="navbar-button">⚙️ 设置</button>
        </div>
    </div>

    <!-- 主要内容区域 -->
    <div class="main-content">
        <!-- 左侧边栏 -->
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <button class="new-chat-button" id="newChatButton">
                    ➕ 新对话
                </button>
            </div>
            <div class="conversations-list" id="conversationsList">
                <!-- 对话列表将在这里动态生成 -->
            </div>
        </div>

        <!-- 聊天区域 -->
        <div class="chat-area">
            <div class="chat-header">
                <div class="chat-title" id="chatTitle">AI图像上色助手</div>
                <div class="chat-subtitle" id="chatSubtitle">让黑白照片重获色彩</div>
            </div>

            <div class="chat-messages" id="chatMessages">
                <div class="welcome-message">
                    <h2>欢迎使用 ArtPaletteAttachment！</h2>
                    <p>上传您的黑白图片，告诉我您想要的上色风格</p>
                    <p>我将为您创造出精美的彩色作品</p>
                    <p><strong>支持格式：</strong>PNG 图片</p>
                </div>
            </div>

            <div class="typing-indicator" id="typingIndicator">
                <div class="typing-dots">
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                </div>
            </div>

            <div class="chat-input">
                <div class="input-container">
                    <div class="input-wrapper">
                        <textarea 
                            id="messageInput" 
                            class="chat-textarea" 
                            placeholder="描述您想要的上色风格，或直接上传图片..."
                            rows="1"
                        ></textarea>
                        <input 
                            type="file" 
                            id="fileInput" 
                            class="file-input" 
                            accept="image/png"
                        >
                        <label for="fileInput" class="file-label">📎</label>
                    </div>
                    <button id="sendButton" class="send-button">
                        ➤
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        class ArtPaletteChat {
            constructor() {
                this.chatMessages = document.getElementById('chatMessages');
                this.messageInput = document.getElementById('messageInput');
                this.fileInput = document.getElementById('fileInput');
                this.sendButton = document.getElementById('sendButton');
                this.typingIndicator = document.getElementById('typingIndicator');
                this.conversationsList = document.getElementById('conversationsList');
                this.newChatButton = document.getElementById('newChatButton');
                this.chatTitle = document.getElementById('chatTitle');
                this.chatSubtitle = document.getElementById('chatSubtitle');
                this.mobileMenuButton = document.getElementById('mobileMenuButton');
                this.sidebar = document.getElementById('sidebar');
                
                this.conversations = this.loadConversations();
                this.currentConversationId = null;
                this.currentImage = null;
                this.isProcessing = false;
                
                this.initializeEventListeners();
                this.renderConversationsList();
                this.autoResizeTextarea();
                
                // 如果没有对话，创建第一个
                if (this.conversations.length === 0) {
                    this.createNewConversation();
                }
            }

            initializeEventListeners() {
                this.sendButton.addEventListener('click', () => this.handleSend());
                this.messageInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter' && !e.shiftKey) {
                        e.preventDefault();
                        this.handleSend();
                    }
                });
                
                this.fileInput.addEventListener('change', (e) => this.handleFileSelect(e));
                this.messageInput.addEventListener('input', () => this.autoResizeTextarea());
                this.newChatButton.addEventListener('click', () => this.createNewConversation());
                this.mobileMenuButton.addEventListener('click', () => this.toggleMobileSidebar());
            }

            toggleMobileSidebar() {
                this.sidebar.classList.toggle('open');
            }

            loadConversations() {
                const saved = localStorage.getItem('artpalette_conversations');
                return saved ? JSON.parse(saved) : [];
            }

            saveConversations() {
                localStorage.setItem('artpalette_conversations', JSON.stringify(this.conversations));
            }

            createNewConversation() {
                const newConversation = {
                    id: Date.now().toString(),
                    title: '新对话',
                    messages: [],
                    createdAt: new Date().toISOString(),
                    updatedAt: new Date().toISOString()
                };

                this.conversations.unshift(newConversation);
                this.saveConversations();
                this.renderConversationsList();
                this.switchToConversation(newConversation.id);
            }

            switchToConversation(conversationId) {
                this.currentConversationId = conversationId;
                const conversation = this.conversations.find(c => c.id === conversationId);
                
                if (conversation) {
                    this.chatTitle.textContent = conversation.title;
                    this.chatSubtitle.textContent = `创建于 ${new Date(conversation.createdAt).toLocaleDateString()}`;
                    this.renderMessages(conversation.messages);
                    this.renderConversationsList();
                }

                // 移动端关闭侧边栏
                if (window.innerWidth <= 640) {
                    this.sidebar.classList.remove('open');
                }
            }

            renderConversationsList() {
                this.conversationsList.innerHTML = '';
                
                this.conversations.forEach(conversation => {
                    const item = document.createElement('div');
                    item.className = `conversation-item ${conversation.id === this.currentConversationId ? 'active' : ''}`;
                    
                    const lastMessage = conversation.messages[conversation.messages.length - 1];
                    const preview = lastMessage ? 
                        (lastMessage.text || '图片消息') : 
                        '开始新对话...';
                    
                    item.innerHTML = `
                        <div class="conversation-title">${conversation.title}</div>
                        <div class="conversation-preview">${preview}</div>
                        <div class="conversation-time">${this.formatTime(conversation.updatedAt)}</div>
                    `;
                    
                    item.addEventListener('click', () => this.switchToConversation(conversation.id));
                    this.conversationsList.appendChild(item);
                });
            }

            formatTime(dateString) {
                const date = new Date(dateString);
                const now = new Date();
                const diffMs = now - date;
                const diffDays = Math.floor(diffMs / (1000 * 60 * 60 * 24));
                
                if (diffDays === 0) {
                    return date.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
                } else if (diffDays === 1) {
                    return '昨天';
                } else if (diffDays < 7) {
                    return `${diffDays}天前`;
                } else {
                    return date.toLocaleDateString('zh-CN');
                }
            }

            updateConversationTitle(conversationId, newTitle) {
                const conversation = this.conversations.find(c => c.id === conversationId);
                if (conversation) {
                    conversation.title = newTitle;
                    conversation.updatedAt = new Date().toISOString();
                    this.saveConversations();
                    this.renderConversationsList();
                    if (conversationId === this.currentConversationId) {
                        this.chatTitle.textContent = newTitle;
                    }
                }
            }

            addMessageToConversation(conversationId, message) {
                const conversation = this.conversations.find(c => c.id === conversationId);
                if (conversation) {
                    conversation.messages.push(message);
                    conversation.updatedAt = new Date().toISOString();
                    
                    // 如果是第一条用户消息，更新对话标题
                    if (conversation.messages.length === 1 && message.sender === 'user' && message.text) {
                        const title = message.text.length > 20 ? 
                            message.text.substring(0, 20) + '...' : 
                            message.text;
                        this.updateConversationTitle(conversationId, title);
                    }
                    
                    this.saveConversations();
                    this.renderConversationsList();
                }
            }

            renderMessages(messages) {
                this.chatMessages.innerHTML = '';
                
                if (messages.length === 0) {
                    this.chatMessages.innerHTML = `
                        <div class="welcome-message">
                            <h2>欢迎使用 ArtPaletteAttachment！</h2>
                            <p>上传您的黑白图片，告诉我您想要的上色风格</p>
                            <p>我将为您创造出精美的彩色作品</p>
                            <p><strong>支持格式：</strong>PNG 图片</p>
                        </div>
                    `;
                    return;
                }

                messages.forEach(message => {
                    this.addMessageToDOM(message.sender, message.text, message.file, message.resultImage);
                });
            }

            autoResizeTextarea() {
                this.messageInput.style.height = 'auto';
                this.messageInput.style.height = Math.min(this.messageInput.scrollHeight, 120) + 'px';
            }

            handleFileSelect(event) {
                const file = event.target.files[0];
                if (file) {
                    this.currentImage = file;
                    const message = {
                        sender: 'user',
                        text: `已选择图片: ${file.name}`,
                        file: file,
                        timestamp: new Date().toISOString()
                    };
                    
                    this.addMessageToDOM('user', message.text, file);
                    this.addMessageToConversation(this.currentConversationId, message);
                    
                    if (!this.messageInput.value.trim()) {
                        this.messageInput.placeholder = "请描述您想要的上色风格...";
                    }
                }
            }

            async handleSend() {
                const message = this.messageInput.value.trim();
                
                if (!message && !this.currentImage) {
                    return;
                }

                if (this.isProcessing) {
                    return;
                }

                // 添加用户消息
                if (message) {
                    const userMessage = {
                        sender: 'user',
                        text: message,
                        timestamp: new Date().toISOString()
                    };
                    
                    this.addMessageToDOM('user', message);
                    this.addMessageToConversation(this.currentConversationId, userMessage);
                }

                // 清空输入
                this.messageInput.value = '';
                this.autoResizeTextarea();

                // 如果有图片和提示词，开始处理
                if (this.currentImage && message) {
                    await this.processColorization(this.currentImage, message);
                } else if (this.currentImage && !message) {
                    const aiMessage = {
                        sender: 'ai',
                        text: '请告诉我您想要什么样的上色风格，比如"温暖的秋日色调"或"鲜艳的夏日色彩"。',
                        timestamp: new Date().toISOString()
                    };
                    
                    this.addMessageToDOM('ai', aiMessage.text);
                    this.addMessageToConversation(this.currentConversationId, aiMessage);
                } else if (!this.currentImage && message) {
                    const aiMessage = {
                        sender: 'ai',
                        text: '请先上传一张PNG格式的黑白图片，然后我就可以根据您的描述为它上色了！',
                        timestamp: new Date().toISOString()
                    };
                    
                    this.addMessageToDOM('ai', aiMessage.text);
                    this.addMessageToConversation(this.currentConversationId, aiMessage);
                }
            }

            async processColorization(imageFile, prompt) {
                this.isProcessing = true;
                this.sendButton.disabled = true;
                this.showTyping();

                try {
                    const formData = new FormData();
                    formData.append('image', imageFile);
                    formData.append('prompt', prompt);

                    const response = await fetch('http://localhost:5000/colorize', {
                        method: 'POST',
                        body: formData
                    });

                    this.hideTyping();

                    if (!response.ok) {
                        const err = await response.json();
                        throw new Error(err.error || '服务器错误');
                    }

                    const contentType = response.headers.get('Content-Type');
                    if (!contentType || !contentType.startsWith('image/')) {
                        throw new Error('服务器返回的不是图像格式');
                    }

                    const blob = await response.blob();
                    const imageUrl = URL.createObjectURL(blob);
                    
                    const aiMessage = {
                        sender: 'ai',
                        text: '太棒了！我已经根据您的描述为图片上色完成。这是上色后的结果：',
                        resultImage: imageUrl,
                        timestamp: new Date().toISOString()
                    };
                    
                    this.addMessageToDOM('ai', aiMessage.text, null, imageUrl);
                    this.addMessageToConversation(this.currentConversationId, aiMessage);
                    
                    // 重置状态
                    this.currentImage = null;
                    this.fileInput.value = '';
                    this.messageInput.placeholder = "描述您想要的上色风格，或直接上传图片...";

                } catch (error) {
                    this.hideTyping();
                    console.error('上色处理失败:', error);
                    
                    const errorMessage = {
                        sender: 'ai',
                        text: `抱歉，处理过程中出现了错误：${error.message}。请检查网络连接或稍后重试。`,
                        timestamp: new Date().toISOString()
                    };
                    
                    this.addMessageToDOM('ai', errorMessage.text);
                    this.addMessageToConversation(this.currentConversationId, errorMessage);
                } finally {
                    this.isProcessing = false;
                    this.sendButton.disabled = false;
                }
            }

            addMessageToDOM(sender, text, file = null, resultImage = null) {
                const messageDiv = document.createElement('div');
                messageDiv.className = `message ${sender}`;

                const contentDiv = document.createElement('div');
                contentDiv.className = 'message-content';

                if (text) {
                    const textP = document.createElement('p');
                    textP.textContent = text;
                    contentDiv.appendChild(textP);
                }

                // 显示上传的文件
                if (file && file.type.startsWith('image/')) {
                    const img = document.createElement('img');
                    img.className = 'message-image';
                    img.src = URL.createObjectURL(file);
                    img.alt = '上传的图片';
                    contentDiv.appendChild(img);
                }

                // 显示处理结果图片
                if (resultImage) {
                    const img = document.createElement('img');
                    img.className = 'message-image';
                    img.src = resultImage;
                    img.alt = '上色结果';
                    contentDiv.appendChild(img);
                }

                messageDiv.appendChild(contentDiv);
                
                // 移除欢迎消息
                const welcomeMessage = this.chatMessages.querySelector('.welcome-message');
                if (welcomeMessage) {
                    welcomeMessage.remove();
                }

                this.chatMessages.appendChild(messageDiv);
                this.scrollToBottom();
            }

            showTyping() {
                this.typingIndicator.style.display = 'block';
                this.scrollToBottom();
            }

            hideTyping() {
                this.typingIndicator.style.display = 'none';
            }

            scrollToBottom() {
                setTimeout(() => {
                    this.chatMessages.scrollTop = this.chatMessages.scrollHeight;
                }, 100);
            }
        }
